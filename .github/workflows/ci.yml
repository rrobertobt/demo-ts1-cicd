name: CI - Build & Test

on:
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wishboard
          POSTGRES_PASSWORD: wishboard
          POSTGRES_DB: wishboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: wishboard
          DB_PASSWORD: wishboard
          DB_NAME: wishboard_test

  build-images:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t wishboard-backend:pr-test ./backend

      - name: Build frontend image
        run: docker build -t wishboard-frontend:pr-test ./frontend

      - name: Verify compose config is valid
        run: docker compose config
        env:
          DB_USER: wishboard
          DB_PASSWORD: wishboard
          DB_NAME: wishboard_test
